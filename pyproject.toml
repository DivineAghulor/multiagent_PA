[project]
name = "multiagent-pa"
version = "0.1.0"
description = "Personal-assistant multi-agent system (PM + Calendar sub-agents) built on LangChain/LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-openai>=0.3",
    "langchain-xai>=0.2",
    "langsmith>=0.1.140",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
